name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # Fixtures are generated at runtime, but git identity is needed for the
      # audit ledger's actor field and for the git-backed scenarios.
      - name: Configure git identity
        run: |
          git config --global user.name "SDLE CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Cross-file sync rules
        run: python scripts/sdle.py lint-skill

      - name: Test suite
        run: python -m pytest -q

      - name: Launcher resolves an interpreter (POSIX)
        if: runner.os != 'Windows'
        run: sh scripts/sdle.sh lint-skill

      - name: Launcher resolves an interpreter (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/sdle.ps1 lint-skill
