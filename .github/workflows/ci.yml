name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # Full history, not the default shallow clone. Several tests assert
      # that a file is byte-identical to its content at a named earlier
      # commit -- `git show <sha>:<path>` -- which is how a phase proves it
      # changed nothing it promised not to. With `fetch-depth: 1` those
      # commits are absent, `git show` fails, and the helper returns None.
      # Their non-vacuity guard then fails loudly rather than letting the
      # comparisons pass by comparing None to None, which is exactly what
      # it is for -- but the run is red for a missing clone, not a defect.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # Fixtures are generated at runtime, but git identity is needed for the
      # audit ledger's actor field and for the git-backed scenarios.
      - name: Configure git identity
        run: |
          git config --global user.name "SDLE CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Cross-file sync rules
        run: python scripts/sdle.py lint-skill

      # Failures are echoed as ::error:: annotations, which are readable on a
      # public repo without a token. Job logs are not, so without this a red
      # build tells a contributor nothing they can act on.
      - name: Test suite
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=line -rf 2>&1 | tee pytest-out.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' pytest-out.txt | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            grep -E '^[^ ].*\.py:[0-9]+: ' pytest-out.txt | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"

      - name: Launcher resolves an interpreter (POSIX)
        if: runner.os != 'Windows'
        run: sh scripts/sdle.sh lint-skill

      - name: Launcher resolves an interpreter (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/sdle.ps1 lint-skill
